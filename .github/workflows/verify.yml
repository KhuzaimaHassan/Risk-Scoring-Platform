name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: risk_test
          POSTGRES_PASSWORD: TestOnly-DatabasePassword!
          POSTGRES_DB: risk_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U risk_test -d risk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      ADMIN_PASSWORD: TestOnly-LongPassword!
      MONITORING_ENABLED: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://risk_test:TestOnly-DatabasePassword!@127.0.0.1:5432/risk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm audit --audit-level=moderate && npm run lint && npm run build
        working-directory: frontend
